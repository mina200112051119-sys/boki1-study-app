name: Install boki app

on:
  push:
    paths:
      - 'install-trigger.txt'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o boki1_github_upload.zip
          cp boki1_v25_520_deploy.html app.html
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.html
          git diff --cached --quiet || git commit -m 'Install boki1 app.html'
          git push
