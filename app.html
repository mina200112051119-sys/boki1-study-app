let rec=JSON.parse(localStorage.getItem('bokiV25')||'{"done":0,"correct":0,"streak":0,"maxStreak":0,"wrong":{},"history":{}}');
let selected=null,current=[],qi=0,mode='';
const app=document.getElementById('app');
const pct=(a,b)=>b?Math.round(a/b*100):0;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const shuffle=a=>a.slice().sort(()=>Math.random()-.5);
function save(){localStorage.setItem('bokiV25',JSON.stringify(rec))}
function allQ(){return QB.slice()}
function topicQ(id){return QB.filter(q=>q.topicId===id)}
function home(){app.innerHTML=`<div class="card"><h2>今日は何をする？</h2><p class="small">収録問題：520問</p>
<button class="primary" onclick="quick(10)">⚡ とにかく10問解く<br><span class="small">分野をまたいで、すぐ練習</span></button>
<button onclick="learn()">📖 勉強する<br><span class="small">56分野から選んで、重要ポイント→1問</span></button>
<button onclick="quick(30)">🔥 30問チャレンジ<br><span class="small">まとめて解いて弱点を発見</span></button>
<button onclick="quick(50)">🏆 50問チャレンジ<br><span class="small">総合トレーニング</span></button>
<button onclick="focusQuiz()">⭐ 重点問題<br><span class="small">1級らしい計算・判断問題を優先</span></button>
<button onclick="startWeak()">🎯 苦手だけ解く<br><span class="small">間違いの多い分野を優先</span></button>
<button onclick="predict()">🔮 予想問題<br><span class="small">弱点＋重点論点から出題</span></button>
<button onclick="status()">📊 学習状況<br><span class="small">正答率・連続正解・苦手分野</span></button></div>
<div class="card"><b>今の成績</b><div class="statgrid" style="margin-top:10px"><div class="stat"><div class="big">${pct(rec.correct,rec.done)}%</div><div class="small">正答率</div></div><div class="stat"><div class="big">${rec.streak}</div><div class="small">連続正解</div></div><div class="stat"><div class="big">${rec.done}</div><div class="small">回答数</div></div></div></div>
<div class="card"><span class="small">おすすめの流れ</span><p>📖 勉強する → ⭐ 重点問題 → ❌ 間違えたら理由を見る → 🎯 苦手をもう一度</p></div>`}
function focusQuiz(){let qs=QB.filter(q=>q.level==='重点');current=shuffle(qs);qi=0;mode='重点問題';quiz()}
function learn(){let cats=[...new Set(TOPICS.map(x=>x.cat))];app.innerHTML=`<button class="back" onclick="home()">← ホーム</button><div class="card"><h2>📖 勉強する</h2><p class="small">56分野から選ぼう。</p>${cats.map(c=>`<h3>${esc(c)}</h3>${TOPICS.filter(t=>t.cat===c).map(t=>{let r=rec.history[t.id]||{n:0,w:0};return `<div class="topic"><button onclick="topic(${t.id})">${t.id}. ${esc(t.name)}<br><span class="small">${r.n?`正答率 ${pct(r.n-r.w,r.n)}%・回答 ${r.n}問`:'未学習'}</span></button></div>`}).join('')}`).join('')}</div>`}
function topic(id){selected=TOPICS.find(t=>t.id===id);let r=rec.history[id]||{n:0,w:0};app.innerHTML=`<button class="back" onclick="learn()">← 分野一覧</button><div class="card"><span class="tag">${esc(selected.cat)}</span><h2>${selected.id}. ${esc(selected.name)}</h2><p>${selected.subs.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</p><div class="answer"><b>この分野の成績</b><br>正答率：${pct(r.n-r.w,r.n)}%　回答：${r.n}問　間違い：${r.w}問</div><button class="primary" onclick="lesson(${id})">📖 重要ポイントを見る</button><button onclick="topicQuiz(${id},false)">✏️ この分野を解く</button><button onclick="topicQuiz(${id},true)">🎯 1問だけ確認する</button></div>`}
function lesson(id){selected=TOPICS.find(t=>t.id===id);let qs=topicQ(id);let q=qs[0];app.innerHTML=`<button class="back" onclick="topic(${id})">← ${esc(selected.name)}</button><div class="card"><span class="tag">${esc(selected.cat)}</span><h2>${esc(selected.name)}</h2><h3>覚える小項目</h3><p>${selected.subs.map(x=>'・'+esc(x)).join('<br>')}</p>${q?`<div class="answer"><b>確認する1問</b><br>${esc(q.q)}</div><button class="primary" onclick="topicQuiz(${id},true)">1問だけ解く</button>`:'<p>この分野の問題を追加中です。</p>'}</div>`}
function topicQuiz(id,one){selected=TOPICS.find(t=>t.id===id);current=shuffle(topicQ(id)).slice(0,one?1:10);qi=0;mode=one?'1問確認':'分野練習';quiz()}
function quick(n){current=shuffle(allQ()).slice(0,n);qi=0;mode=n+'問チャレンジ';quiz()}
function startWeak(){let qs=allQ().filter(q=>(rec.wrong[q.topicId]||0)>0);if(!qs.length){app.innerHTML='<button class="back" onclick="home()">← ホーム</button><div class="card"><h2>🎯 苦手問題</h2><p>まだ間違いの記録がありません。まず10問解こう。</p></div>';return}qs.sort((a,b)=>(rec.wrong[b.topicId]||0)-(rec.wrong[a.topicId]||0));current=shuffle(qs).slice(0,30);qi=0;mode='苦手問題';quiz()}
function predict(){let qs=allQ();qs.sort((a,b)=>(rec.wrong[b.topicId]||0)-(rec.wrong[a.topicId]||0));let focus=qs.filter(q=>q.level==='重点');let rest=shuffle(qs.filter(q=>q.level!=='重点')).slice(0,15);current=shuffle(focus.slice(0,15).concat(rest));qi=0;mode='予想問題';quiz()}
function quiz(){if(qi>=current.length)return finish();let q=current[qi];app.innerHTML=`<button class="back" onclick="home()">← 終了</button><div class="small">${qi+1} / ${current.length}　${esc(mode)}　${esc(q.topic)}${q.level==='重点'?'　⭐':''}</div><div class="progress"><i style="width:${Math.round(qi/current.length*100)}%"></i></div><div class="card"><span class="tag">${esc(q.sub||q.topic)}</span><h2>${esc(q.q)}</h2><div id="choices">${q.choices.map((a,n)=>`<button class="choice" onclick="answer(${n})">${String.fromCharCode(65+n)}　${esc(a)}</button>`).join('')}</div><div id="result"></div></div>`}
function answer(n){let q=current[qi],ok=n===q.a;rec.done++;if(ok){rec.correct++;rec.streak++;rec.maxStreak=Math.max(rec.maxStreak,rec.streak)}else{rec.streak=0;rec.wrong[q.topicId]=(rec.wrong[q.topicId]||0)+1}let h=rec.history[q.topicId]||(rec.history[q.topicId]={n:0,w:0});h.n++;if(!ok)h.w++;save();document.querySelectorAll('.choice').forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add('correct');if(k===n&&!ok)b.classList.add('wrong')});document.getElementById('result').innerHTML=`<div class="result ${ok?'good':'bad'}"><b>${ok?'⭕ 正解！':'❌ 不正解'}</b><p><b>正解：${String.fromCharCode(65+q.a)}　${esc(q.choices[q.a])}</b></p><p>${esc(q.explain||'正解の理由を確認しましょう。')}</p><p><b>混同ポイント：</b>${esc(q.confuse||'似た論点と区別して覚えよう。')}</p><button class="primary" onclick="qi++;quiz()">次の問題 →</button></div>`}
function finish(){app.innerHTML=`<button class="back" onclick="home()">← ホーム</button><div class="card"><h2>🎉 終了</h2><div class="statgrid"><div class="stat"><div class="big">${pct(rec.correct,rec.done)}%</div><div class="small">累計正答率</div></div><div class="stat"><div class="big">${rec.streak}</div><div class="small">現在の連続正解</div></div><div class="stat"><div class="big">${rec.maxStreak}</div><div class="small">最高連続正解</div></div></div><button class="primary" onclick="home()">ホームへ</button></div>`}
function status(){let a=Object.entries(rec.history).map(([id,v])=>({id:+id,...v})).filter(x=>x.n).sort((a,b)=>(b.w/b.n)-(a.w/a.n));app.innerHTML=`<button class="back" onclick="home()">← ホーム</button><div class="card"><h2>📊 学習状況</h2><div class="statgrid"><div class="stat"><div class="big">${pct(rec.correct,rec.done)}%</div><div class="small">正答率</div></div><div class="stat"><div class="big">${rec.streak}</div><div class="small">連続正解</div></div><div class="stat"><div class="big">${rec.done}</div><div class="small">回答数</div></div></div></div><div class="card"><h3>🎯 苦手分野</h3>${a.length?a.slice(0,15).map(x=>{let t=TOPICS.find(t=>t.id===x.id);return `<p><b>${t?esc(t.name):x.id}</b>　${pct(x.n-x.w,x.n)}%　<span class="small">${x.w}/${x.n} 不正解</span></p>`}).join(''):'<p>まだ記録がありません。</p>'}</div><div class="card"><h3>記録</h3><p>最高連続正解：${rec.maxStreak}</p><button onclick="resetData()">学習記録をリセット</button></div>`}
function resetData(){if(confirm('学習記録を全部リセットしますか？')){localStorage.removeItem('bokiV25');location.reload()}}
home();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}</script></body></html>
